name: Rust

on:
  push:
    branches: [ "main" ]
    tags: ["v*"]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动提供的 token

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ocr
            asset_name: pp-ocr-rs-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ocr
            asset_name: pp-ocr-rs-${{ github.ref_name }}-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ocr
            asset_name: pp-ocr-rs-${{ github.ref_name }}-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ocr.exe
            asset_name: pp-ocr-rs-${{ github.ref_name }}-x86_64-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build binary
      run: cargo build --release --features server --target ${{ matrix.target }}

    - name: Strip binary (Unix)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Package binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p release
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release/
        cp README.md release/ 2>/dev/null || echo "README.md not found, skipping"
        tar czf ${{ matrix.asset_name }} -C release .

    - name: Package binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir release
        copy target\${{ matrix.target }}\release\${{ matrix.artifact_name }} release\
        copy README.md release\ 2>nul || echo README.md not found, skipping
        7z a ${{ matrix.asset_name }} .\release\*

    - name: Generate checksum (Unix)
      if: matrix.os != 'windows-latest'
      run: sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

    - name: Generate checksum (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $hash = (Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
        $hash | Out-File -FilePath ${{ matrix.asset_name }}.sha256 -Encoding utf8

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ matrix.asset_name }}
          ${{ matrix.asset_name }}.sha256
        overwrite: true  # 允许覆盖已存在的 release
